image: debian:stable

variables:
  PIP_ROOT_USER_ACTION: ignore
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  VENV_PATH: "$CI_PROJECT_DIR/venv"

stages:
  - build
  - test

.version_tag:
  # see https://peps.python.org/pep-0440/
  # courtesy of T. Janvier (brgm)
  only:
    variables:
      - $CI_COMMIT_TAG =~ /^(?P<epoch>\D+)?(?P<version>(?P<release>\d+(?:\.\d+)*)(?P<pre>(?:a|b|rc)\d+?)?((?P<post>\.post\d+))?(?P<dev>\.dev\d+)?(?P<build>\+\S+)?)$/
  except:
    - branches


.apt-env: &apt-env
  - apt-get clean
  - apt-get update -y
  - apt install -y python3 python3-pip python3-venv
  - apt install -y gfortran gcc ninja-build


.install-env: &install-env
  - python3 -m venv $VENV_PATH
  - source $VENV_PATH/bin/activate
  - pip install --upgrade pip setuptools wheel


before_script:
  - *apt-env
  - *install-env


build:
  stage: build
  only:
    - main
    - tags
  script:
    - pip install build
    - python3 -m build -s
    - python3 -m build -w
  artifacts:
    paths:
      - dist/
    expire_in: 24 hours


