# Gitlab CI config - Courtesy of T. Janvier (BRGM)
default: # linux image on linux runnner
  image: nexus-docker.brgm.fr/brgm/miniconda3:latest
  tags:
    - brgm

.windows: # windows image on windows runnner
  image: nexus-docker.brgm.fr/brgm/miniconda3:windows
  tags:
    - windows-2022-docker


stages:
  - build
  - test
  - deploy


.version_tag:
  only: # see https://peps.python.org/pep-0440/
    variables:
      - $CI_COMMIT_TAG =~ /^(?P<epoch>\D+)?(?P<version>(?P<release>\d+(?:\.\d+)*)(?P<pre>(?:a|b|rc)\d+?)?((?P<post>\.post\d+))?(?P<dev>\.dev\d+)?(?P<build>\+\S+)?)$/
  except:
    - branches


# ----- Build ----- #

.build:
  stage: build
  extends: .version_tag
  when: manual
  script:
    # build multiple versions using cibuildwheel
    # - python -m cibuildwheel --output-dir ./dist 
    # build standalone environment for testing (current package + all dependencies)
    # - python -m pip wheel -w ./dist/wheelhouse .[test]
    - python -m pip wheel -w ./dist/ .
  artifacts:
    paths:
    - dist/
    expose_as: wheel
    expire_in: 12 hours
    

build-linux:
  when: manual
  extends: .build
  before_script:
    - echo "gridmarthe ci/cd pipeline"
    - python --version
    - mamba install gfortran
    - gfortran --version
    - python -m pip install --upgrade pip setuptools wheel
    - python -m pip install cibuildwheel build
    # uncomment next line if you need internal dependencies
    # - python -m pip config set global.index-url ${REGISTRY_NEXUS}/pypi-all/simple

build-windows:
  when: manual
  extends: 
    - .windows
    - .build
  before_script:
    - echo "gridmarthe ci/cd pipeline"
    - python --version
    - gfortran --version
    - pip install --upgrade pip setuptools wheel
    - pip install cibuildwheel build


# ----- Test config ----- #

.test:
  stage: test
  extends: .version_tag
  when: manual
  script:
    - python -c 'import gridmarthe'
  # allow_failure: true


test-linux:
  needs: ["build-linux"]
  extends: .test
  before_script:
    - echo "gridmarthe ci/cd pipeline"
    - python --version
    - mamba install gfortran
    - gfortran --version
    - python -m pip install --no-index --no-deps dist/*none*.whl # no-index: avoid search pypi index ; no-deps, wheels already build
    - python -m pip install --no-index --no-deps dist/*linux*.whl


test-windows:
  needs: ["build-windows"]
  extends: 
    - .windows
    - .test
  before_script:
    - echo "gridmarthe ci/cd pipeline"
    - python --version
    - gfortran --version
    - pip install --no-index --no-deps dist/*none*.whl
    - pip install --no-index --no-deps dist/*win*.whl



# ----- Publish ----- #

.deploy:
  extends: .version_tag
  stage: deploy
  except:
    - branches


deploy-nexus_snapshot:
  needs: ["build-linux", "build-windows"]
  extends: .deploy
  before_script:
    - echo ${NEXUS_URL}
    - echo ${REGISTRY_NEXUS_USER}
    - echo ${REGISTRY_NEXUS}
    - pip install twine
  script:
    - twine upload -u ${REGISTRY_NEXUS_USER} -p ${REGISTRY_NEXUS_PASSWORD} --repository-url ${REGISTRY_NEXUS}/pypi-snapshots/ dist/*.whl
  when: manual


deploy-pip:
  needs: ["build-linux", "build-windows"]
  extends: .deploy
  before_script:
    - pip install twine
  script:
    - twine upload --skip-existing --verbose dist/*.whl
  when: manual

