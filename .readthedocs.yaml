# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  apt_packages:
    - libclang
    - gcc
    - gfortran
  jobs:
    post_checkout:
      - gfortran -v
    pre_build:
      - pip install numpy charset_normalizer
      - cd src/gridmarthe/lecsem ; CC=gcc FC=gfortran f2py -c lecsem.f90 edsemigl.f90 scan_grid.f90 -m lecsem --backend=meson --lower

python:
  install:
    - method: pip
      path: .
      extra_requirements: 
        - doc

sphinx:
  configuration: docs/source/conf.py