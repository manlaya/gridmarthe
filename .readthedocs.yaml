# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  apt_packages:
    - gcc
    - gfortran
    - ninja-build
    - netcdf-bin
    - nco
  jobs:
    pre_build:
      - pip install numpy charset_normalizer meson meson-python
      - pip install .[opt,doc]
      - python3 -c "import gridmarthe"

sphinx:
  configuration: docs/source/conf.py
