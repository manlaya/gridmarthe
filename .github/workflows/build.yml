name: Build and Publish

on:
  push:
    branches:
      - ci
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-11]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # install compiler for Fortran dep
      - name: Install gfortran (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y
      
      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc gfortran

      - name: Install gfortran (MacOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          export PATH="${PATH}:/opt/homebrew/bin"
          # https://github.com/actions/runner-images/issues/3371
          sudo ln -s /usr/local/bin/gfortran-11 /usr/local/bin/gfortran
          sudo mkdir /usr/local/gfortran
          sudo ln -s /usr/local/Cellar/gcc@11/*/lib/gcc/11 /usr/local/gfortran/lib
     
      # Check gfortran
      - name: Verify gfortran installation
        run: gfortran --version

      # Build wheels
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install cibuildwheel
        run: pip install cibuildwheel
        
      - name: Build wheels with cibuildwheel
        run: cibuildwheel --output-dir dist



