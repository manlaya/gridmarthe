name: Build and Publish

on:
  push:
    branches:
      - ci
  pull_request:

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # install compiler for Fortran dep
      - name: Install gfortran (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y
      
      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc gfortran

      - name: Install gfortran (MacOS)
        if: runner.os == 'macOS'
        run: brew install gcc
        
      - name: Symlink gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          # make sure gfortran is available
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
          # https://github.com/actions/runner-images/issues/3371export
          PATH="${PATH}:/opt/homebrew/bin"
          sudo ln -s /usr/local/bin/gfortran-12 /usr/local/bin/gfortran
          sudo mkdir /usr/local/gfortran
          sudo ln -s /usr/local/Cellar/gcc@12/*/lib/gcc/12 /usr/local/gfortran/lib
     
      # Check gfortran
      - name: Verify gfortran installation
        run: gfortran --version

      # Build wheels
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install cibuildwheel
        run: pip install cibuildwheel
        
      - name: Build wheels with cibuildwheel
        run: cibuildwheel --output-dir dist

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build_wheels
    steps:
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          

