name: Build and Publish

on:
  push:
    branches:
      - ci
  pull_request:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # mac os 14 at least - runner with Apple Silicon
        os: [ubuntu-latest, windows-latest]  # macos-14, drop mac-os build
    env:
      FC: gfortran
      GCC_V: 12 # only for MACOS
      #TZ: UTC+01:00

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # install compiler for Fortran dep
      - name: Install gfortran (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y
      
      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc gfortran

      - name: Install gfortran (MacOS)
        if: runner.os == 'macOS'
        run: brew install gcc
        
      - name: Symlink gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          # make sure gfortran is available
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
          # https://github.com/actions/runner-images/issues/3371
          # ln version - new path 'MacOS14'
          sudo ln -fs /opt/homebrew/bin/gfortran-${GCC_V} /usr/local/bin/gfortran
          sudo mkdir -p /usr/local/gfortran
          sudo ln -sf /opt/homebrew/Cellar/gcc@${GCC_V}/*/lib/gcc/${GCC_V} /usr/local/gfortran/lib
     
      # dép de gcc compilées avec macos latest...
      # TODO compiler avec macos12 et tester sur macos14
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
     
      # Check gfortran
      - name: Verify gfortran installation
        run: gfortran --version

      # Build wheels
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel
        
      - name: Install delvewheel (Windows)
        if: runner.os == 'Windows'
        run: pip install delvewheel
        
      - name: Build wheels with cibuildwheel
        run: cibuildwheel --output-dir dist
      
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: cibw-bdist_${{ matrix.os }}-${{ strategy.job-index }}
          path: dist/*.whl
          overwrite: true
          # if-no-files-found: ignore
          # retention-days: 1


  # add src dist
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  
  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: testpypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://test.pypi.org/p/gridmarthe
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}
      
    permissions:
      # IMPORTANT: mandatory for trusted publishing
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: cibw-*
        path: dist/
        merge-multiple: true
    
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
        skip-existing: true
        

  pypi-publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, publish-to-testpypi]
    runs-on: ubuntu-latest
    # if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes

    environment:
      name: pypi
      url: https://pypi.org/p/gridmarthe

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist/
          merge-multiple: true
      
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: true
          # fix error 404 with default https://pypi.org/legacy/
          repository-url: https://upload.pypi.org/legacy/
