[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmarthe"
version = "0.1"
authors = [
    {name = "Jean-Pierre Vergnes", email = "jp.vergnes@brgm.fr"},
    {name = "Adrien Manlay", email = "a.manlay@brgm.fr"},
]

description = "python package to wrap Marthe Grids"
readme = {file = "README.md", content-type = "text/markdown"}   
license = {file = "LICENSE"}

classifiers = [
    "Programming Language :: Python : 3",
    "License :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]

keywords = ["hydrology", "groundwater", "modelling"]

requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "netCDF4",
    "h5netcdf",
    "xarray",
    "geopandas", "rasterio", "rioxarray", "shapely", "matplotlib"
]

[project.optional-dependencies]
# install with `pip install gridmarthe[io]`
# io = []

[project.urls]
Homepage = "https://gitlab.brgm.fr/brgm/codes-hydrogeologiques/others/gridmarthe"


[tool.setuptools]
include-package-data = true

# [tool.setuptools.packages.find]
# where = ["src"] # not necessary, with toml, by default, src and flat layout are automatically discovered

[tool.setuptools.package-data]
# "*" = ["*.txt"] # if several package in src
gridmarthe = ["*.pyd", "*.dll", "*.so"] # works like a charm

[project.scripts]
chasim2nc = "gridmarthe:scripts.chasim2nc"
